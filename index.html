<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PUSKESMAS KALIBUNDER</title>
  <link rel="icon" href="https://static.wixstatic.com/media/35bdc2_79e8b91598324d82be6e44874e4d29bd~mv2.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxjlo505FM9_xbc_HXe4cbo3f5Lep7ujxqYZrhN5LhQ7XGkrCBaQC5mZGGeYGd9O9vHAA/exec"
      scrolling="yes"
      allowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation">
    </iframe>
  </div>
</body>
</html>
